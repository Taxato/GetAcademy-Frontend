<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link
			rel="stylesheet"
			href="style.css" />

		<script
			defer
			src="script.js"></script>
	</head>
	<body>
		<header class="site-header">
			<a
				class="logo"
				href="/"
				aria-label="Hjem">
				MySite
			</a>

			<button
				class="menu-toggle"
				type="button"
				aria-expanded="false"
				aria-controls="site-nav">
				<span class="menu-toggle__label">Meny</span>
				<span
					class="menu-toggle__icon"
					aria-hidden="true">
					<span></span>
					<span></span>
					<span></span>
				</span>
			</button>

			<nav
				id="site-nav"
				class="site-nav"
				aria-label="Hovedmeny"
				hidden>
				<ul class="site-nav__list">
					<li>
						<a href="/">Hjem</a>
					</li>
					<li>
						<a href="/om">Om</a>
					</li>
					<li>
						<a href="/prosjekter">Prosjekter</a>
					</li>
					<li>
						<a href="/kontakt">Kontakt</a>
					</li>
				</ul>
			</nav>
		</header>

		<main></main>

		<footer></footer>
	</body>
</html>
